<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=big5">
<title></title>
<style type="text/css">
    body{
        margin: 0px; 
        padding: 0px 25px 3px 11px;
        font-family: 'Microsoft JhengHei', 微軟正黑體, Verdana, 'Trebuchet MS', Calibri, Meiryo, 明瞭體, PMingLiU, 新細明體, MingLiU, 細明體;
    }
    
    #cathay_common_msgBoard{
        border: 3px double darkgray; 
        background-color: #EDEFF0; 
        line-height: 24px; 
        height:24px; 
        margin:0px; 
        padding: 0px 8px;
    }
</style>
<script type="text/javaScript" src="../js/ajax/prototype.js"></script>
<script type="text/javaScript">

var interval_id;
var txHasRollbackPage;// Will be set if tx has rollback page.
var in_err_msg;

function rollbackPage(errMsg){
	var getMainFrame = function(){
		if(top.frames['mainFrame']){
			return top.frames['mainFrame'];
		}else if(parent.frames['mainFrame']){
			return parent.frames['mainFrame'];
		}	
	}

	txHasRollbackPage = true;
	in_err_msg = errMsg;

	var mainFrame = getMainFrame;
	if(mainFrame.history.length>0){
    	mainFrame.history.back();
    }

    interval_id = window.setInterval('window.clearInterval(interval_id);clearNotifyMsg();if(in_err_msg){alert(in_err_msg);}', 300);
}

function nextMsg(){
	parent.frames['mainFrame'].nextMessage();
}

function prevMsg(){
	parent.frames['mainFrame'].prevMessage();
}

function clearNotifyMsg(){
	$('cathay_common_msgBoard').update()
}

function showNotifyMsg(msgObj){
	var msg = msgObj['returnMessage'];
	var msgCode = msgObj['returnCode'];
	if(msgObj){
		msg = msgObj['returnMessage'];
		msgCode = msgObj['returnCode'];
	}else{
		msg = '';
		msgCode = 0;
	}

	var msgBoard = $('cathay_common_msgBoard').update();

	var checkDisplayType = function(type){
	    switch(type){
	    	case "E": return "textError";
	        case "N": return "textNotify";
	        case "W":
	        default: return "textWarning";
	    }
	}

	if(msgCode!=0){
		msgBoard.writeAttribute('className', checkDisplayType("E"));
		msgBoard.update('<font color="red">'+msg+'</font>');
	}else{
		msgBoard.writeAttribute('className', checkDisplayType("N"));
		msgBoard.update(msg);
	}
}
</script>
</head>
<body>
    <div id="cathay_common_msgBoard"><span class="textNotify">&nbsp;</span></div>
</body>
</html>
